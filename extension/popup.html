<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: light dark; }
    body { width: 300px; margin: 0; font: 13px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif; }
    .status { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid rgba(128,128,128,.25); }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: #9e9e9e; }
    .dot.ok { background: #2e7d32; }
    .dot.bad { background: #c62828; }
    h2 { margin: 10px 14px 4px; font-size: 11px; font-weight: 600; opacity: .6; text-transform: uppercase; letter-spacing: .04em; }
    ul { list-style: none; margin: 0 0 6px; padding: 0; }
    li { padding: 5px 14px; display: flex; gap: 8px; align-items: baseline; }
    li .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    li .st { flex-shrink: 0; font-size: 11px; opacity: .65; }
    li .st.bad { color: #c62828; opacity: 1; }
    .empty { padding: 5px 14px 10px; opacity: .55; }
    footer { padding: 8px 14px 12px; border-top: 1px solid rgba(128,128,128,.25); }
    footer a { color: inherit; opacity: .75; cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="status"><span class="dot" id="dot"></span><span id="status-text">…</span></div>
  <h2 id="recent-title"></h2>
  <ul id="recent"></ul>
  <p class="empty" id="empty" hidden></p>
  <footer><a id="options"></a></footer>
  <script src="popup.js"></script>
</body>
</html>
