# Vixel Server（Docker / NAS 版）compose 示例。
# 群晖 Container Manager：项目 → 创建 → 粘贴本文件，改好口令和照片路径即可。
# 详细说明（含群晖逐步截图说明、反代 HTTPS、备份）：docs/server/README.md
services:
  vixel:
    # 自己构建：docker buildx build -t vixel:latest --load . 然后这里改成 vixel:latest
    image: ghcr.io/rgb-loop/vixel:latest
    container_name: vixel
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 必填：网页登录口令（至少 4 位）
      VIXEL_PASSWORD: "change-me"
      # 媒体库目录（容器内路径，逗号分隔）。默认 /photos；多个库各挂各的再在这里列出
      VIXEL_LIBRARY_DIRS: /photos
      # 群晖/Unraid 习惯：照片文件夹属主的 UID/GID（File Station → 属性可查；ssh 里 id <用户名>）
      PUID: "1000"
      PGID: "1000"
      # CPU 推理线程数（语义模型 + OCR / 人脸），默认核数一半。NAS 上嫌索引吃 CPU 可调小
      # VIXEL_THREADS: "2"
      # 低内存模式（镜像默认开）：语义模型和 OCR / 人脸模型不同时驻留、空闲后卸载，
      # mem_limit: 2g 即可完整索引；代价是模型闲置后的第一次搜索要等重载。
      # 内存充裕（给容器 4 GB+）想要模型常驻、搜索永远即时：
      # VIXEL_LOW_MEMORY: "0"
      # HTTPS 反代（Synology 反向代理 / Nginx / Caddy）在前面时：
      # VIXEL_TRUST_PROXY: "1"
    # 群晖：共享文件夹通常只授权给用户组（管理员账号靠 administrators 组访问），
    # 容器进程只有主组 PGID 时会读不到照片（日志里 permission denied）。把能读照片的组加进来：
    # group_add:
    #   - "101"   # administrators；`id 你的用户名` 输出里的 groups=… 都可以
    volumes:
      # 照片/视频：只读挂载（:ro），Vixel 永远不写原文件。多个库就多挂几行：
      #   - /volume1/photo:/photos/photo:ro
      #   - /volume1/video:/photos/video:ro
      - /path/to/photos:/photos:ro
      # 索引数据库、缩略图、人脸向量等（备份这个卷即可；原图不在里面）
      - vixel-data:/data
    # 可选：限制内存。低内存模式（镜像默认）下 2g 即可完整索引；
    # 设了 VIXEL_LOW_MEMORY=0（模型常驻）则不要低于 3g
    # mem_limit: 2g

volumes:
  vixel-data:
